<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Plane — Simulador de aviones de papel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 46, 0.82);
      --panel-border: rgba(120, 160, 255, 0.14);
      --text: #e8eeff;
      --muted: #8b97b8;
      --accent: #ffb020;
      --accent-2: #48dbfb;
      --good: #1dd1a1;
      --bad: #ff6b6b;
      --radius: 16px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* ===================== ESTRUCTURA ===================== */
    #app { display: grid; grid-template-rows: 54px 1fr; height: 100vh; }

    #topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: rgba(9, 13, 30, 0.9);
      border-bottom: 1px solid var(--panel-border);
      z-index: 10;
    }
    .brand { font-size: 15px; letter-spacing: 2px; color: var(--accent-2); }
    .brand b { color: var(--text); }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(72, 219, 251, 0.1);
      border: 1px solid rgba(72, 219, 251, 0.3);
      color: var(--text);
      font-size: 13px;
      cursor: default;
    }
    .chip b { letter-spacing: 1px; color: var(--accent-2); }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }
    .dot.race { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    #stage { display: grid; grid-template-columns: 300px 1fr 300px; min-height: 0; }

    /* ---------- paneles ---------- */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--panel-border);
      padding: 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(140, 170, 255, 0.25) transparent;
    }
    #sidebar { border-right: none; border-left: 1px solid var(--panel-border); }
    .panel h2 {
      font-size: 11.5px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 10px;
    }
    .panel h2:first-child { margin-top: 0; }
    .badge {
      display: inline-block;
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(72, 219, 251, 0.18);
      color: var(--accent-2);
      font-size: 11px;
      text-align: center;
    }

    /* ---------- tarjetas de avión ---------- */
    .plane-card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      margin-bottom: 8px;
      animation: slide-left 0.3s ease;
    }
    .plane-card.editing { border-color: rgba(72, 219, 251, 0.5); background: rgba(72, 219, 251, 0.07); }
    .plane-card .swatch { width: 13px; height: 13px; border-radius: 4px; box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
    .pc-info { min-width: 0; }
    .pc-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pc-record { margin-left: auto; font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pc-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 25px; height: 25px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.18); color: var(--text); }

    .btn-new {
      width: 100%;
      padding: 10px;
      border: 1.5px dashed rgba(140, 170, 255, 0.35);
      border-radius: 12px;
      background: transparent;
      color: var(--accent-2);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-new:hover:not(:disabled) { background: rgba(72, 219, 251, 0.08); border-color: var(--accent-2); }
    .btn-new:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-note { font-size: 12.5px; color: var(--muted); text-align: center; padding: 8px 4px; line-height: 1.4; }

    /* ---------- formulario de avión ---------- */
    .plane-form {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
      animation: slide-left 0.25s ease;
    }
    .plane-form h3 {
      font-size: 11.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 11px;
    }
    .field { display: block; text-align: left; margin-bottom: 13px; }
    .field > span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin-bottom: 6px; }
    .field input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(140, 170, 255, 0.22);
      background: rgba(8, 12, 28, 0.75);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input[type="text"]:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(72, 219, 251, 0.18); }

    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-picker button {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-picker button:hover { transform: scale(1.15); }
    .color-picker button.sel { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 12px currentColor; }

    .slider-row { display: block; margin: 13px 0 2px; }
    .slider-name { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
    .slider-name b { color: var(--accent); font-variant-numeric: tabular-nums; }

    input[type="range"] {
      width: 100%;
      margin-top: 7px;
      appearance: none;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb {
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      cursor: grab;
    }
    input[type="range"]:disabled { opacity: 0.45; }

    .form-actions { display: flex; gap: 8px; margin-top: 14px; }
    .form-actions .btn-primary { flex: 1; padding: 10px; font-size: 14px; }
    .btn-ghost {
      padding: 10px 14px;
      border: 1px solid rgba(140, 170, 255, 0.25);
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #ff7a18);
      color: #241200;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(255, 140, 20, 0.32);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .btn-primary:active { transform: translateY(0); }

    /* ---------- preview ---------- */
    #preview {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(60, 90, 170, 0.25), rgba(20, 30, 60, 0.5));
      border: 1px solid rgba(140, 170, 255, 0.14);
      margin: 12px 0 4px;
    }

    /* ---------- botón play ---------- */
    .btn-launch {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--good), #0ea47f);
      color: #04241b;
      font-size: 16.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(29, 209, 161, 0.3);
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-launch:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
    .btn-launch:disabled { filter: grayscale(0.8); opacity: 0.45; cursor: not-allowed; }

    .flight-status { min-height: 18px; margin-top: 9px; font-size: 12.5px; text-align: center; color: var(--accent-2); }

    /* ---------- escena ---------- */
    #scene-wrap { position: relative; min-width: 0; overflow: hidden; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- telemetría ---------- */
    .telemetry {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(8, 12, 28, 0.78);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      animation: slide-up 0.35s ease;
    }
    @keyframes slide-up { from { transform: translateY(20px); opacity: 0; } }
    @keyframes slide-left { from { transform: translateX(30px); opacity: 0; } }

    .gauge { display: flex; flex-direction: column; align-items: center; min-width: 62px; }
    .g-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .g-val { font-size: 21px; font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; line-height: 1.15; }
    .g-unit { font-size: 10px; color: var(--muted); }
    #chart { border-radius: 8px; background: rgba(255, 255, 255, 0.04); }

    /* ---------- tarjeta de resultado ---------- */
    .result-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(360px, 88%);
      padding: 24px;
      text-align: center;
      background: rgba(10, 15, 34, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      animation: pop-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.35);
      z-index: 5;
    }
    @keyframes pop-in { from { transform: translate(-50%, -50%) scale(0.9); opacity: 0; } }
    .result-title { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); }
    .result-dist { font-size: 24px; font-weight: 900; color: var(--accent); text-shadow: 0 6px 30px rgba(255, 176, 32, 0.4); }
    .result-dist b { font-size: 58px; line-height: 1.1; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
    .result-grid div { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 8px 4px; }
    .result-grid span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .result-grid b { font-size: 15px; color: var(--text); }
    .result-card.record { border-color: rgba(255, 176, 32, 0.6); box-shadow: 0 0 60px rgba(255, 176, 32, 0.25); }

    /* ---------- feed de actividad ---------- */
    .feed {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      max-width: 46%;
    }
    .feed-msg {
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(8, 12, 28, 0.82);
      border: 1px solid var(--panel-border);
      font-size: 13px;
      color: var(--text);
      animation: slide-left 0.3s ease;
      backdrop-filter: blur(6px);
    }
    .feed-msg.fade { opacity: 0; transition: opacity 0.8s; }

    /* ---------- listas del sidebar ---------- */
    .players-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .players-list li {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      font-size: 13.5px;
    }
    .players-list .swatch { width: 11px; height: 11px; border-radius: 3px; box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
    .players-list .state { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .players-list .state.flying { color: var(--accent-2); }
    .players-list .state.done { color: var(--good); }

    .leaderboard { list-style: none; counter-reset: rank; display: flex; flex-direction: column; gap: 7px; }
    .leaderboard li {
      counter-increment: rank;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 13.5px;
    }
    .players-list li.enter,
    .leaderboard li.enter { animation: slide-left 0.3s ease; }
    .leaderboard li::before {
      content: counter(rank);
      width: 21px; height: 21px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      flex-shrink: 0;
    }
    .leaderboard li:first-child::before { background: var(--accent); color: #241200; }
    .leaderboard li:nth-child(2)::before { background: #c8d0e8; color: #1a1f33; }
    .leaderboard li:nth-child(3)::before { background: #d2955b; color: #2a1404; }
    .leaderboard .lb-dist { margin-left: auto; font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .leaderboard .empty, .history .empty { color: var(--muted); font-size: 12.5px; background: none !important; padding-left: 4px; }
    .leaderboard .empty::before, .history .empty::before { display: none; }

    .history { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .history li { display: flex; gap: 8px; font-size: 12.5px; color: var(--muted); align-items: center; }
    .history li b { color: var(--text); }
    .history .swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .history .rec-dist { margin-left: auto; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 1080px) {
      #stage { grid-template-columns: 260px 1fr 250px; }
    }
    @media (max-width: 880px) {
      #stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; overflow-y: auto; }
      .panel { border: none; border-top: 1px solid var(--panel-border); }
      #scene-wrap { min-height: 52vh; order: -1; }
      .telemetry { flex-wrap: wrap; max-width: calc(100% - 28px); }
      #chart { display: none; }
    }
  </style>
</head>
<body>

  <div id="app">
    <header id="topbar">
      <div class="brand">✈ <b>PAPER PLANE</b></div>
      <span class="chip"><b id="planes-chip">0 aviones</b></span>
      <div class="top-right">
        <span id="conn-dot" class="dot"></span>
        <span id="state-label">listo</span>
      </div>
    </header>

    <main id="stage">

      <!-- Panel izquierdo: hangar -->
      <aside id="hangar" class="panel">
        <h2>Hangar <span id="planes-n" class="badge">0</span></h2>
        <div id="planes-list"></div>
        <button id="btn-new" class="btn-new">+ Nuevo avión</button>

        <form id="plane-form" class="plane-form hidden" autocomplete="off">
          <h3 id="form-title">Nuevo avión</h3>

          <label class="field">
            <span>Nombre</span>
            <input id="f-name" type="text" maxlength="16" placeholder="p. ej. Golondrina" />
          </label>

          <div class="field">
            <span>Color</span>
            <div id="f-colors" class="color-picker"></div>
          </div>

          <label class="slider-row">
            <span class="slider-name">Peso <b id="v-peso">12 g</b></span>
            <input id="f-peso" type="range" min="2" max="40" step="1" value="12" />
          </label>

          <label class="slider-row">
            <span class="slider-name">Ángulo de lanzamiento <b id="v-angulo">18°</b></span>
            <input id="f-angulo" type="range" min="-10" max="60" step="1" value="18" />
          </label>

          <label class="slider-row">
            <span class="slider-name">Longitud de alas <b id="v-alas">15 cm</b></span>
            <input id="f-alas" type="range" min="5" max="30" step="1" value="15" />
          </label>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar</button>
            <button type="button" id="f-cancel" class="btn-ghost">Cancelar</button>
          </div>
        </form>

        <canvas id="preview" width="252" height="110" aria-label="Vista del avión"></canvas>

        <button id="btn-play" class="btn-launch" disabled>▶ Lanzar carrera</button>
        <div id="race-status" class="flight-status"></div>
      </aside>

      <!-- Escena -->
      <section id="scene-wrap">
        <canvas id="scene"></canvas>

        <div id="telemetry" class="telemetry hidden">
          <div class="gauge"><span class="g-label">Líder: altitud</span><span class="g-val" id="g-alt">0.0</span><span class="g-unit">m</span></div>
          <div class="gauge"><span class="g-label">Velocidad</span><span class="g-val" id="g-speed">0.0</span><span class="g-unit">m/s</span></div>
          <div class="gauge"><span class="g-label">Distancia</span><span class="g-val" id="g-dist">0.0</span><span class="g-unit">m</span></div>
          <div class="gauge"><span class="g-label">Áng. ataque</span><span class="g-val" id="g-aoa">0.0</span><span class="g-unit">°</span></div>
          <canvas id="chart" width="230" height="96" aria-label="Trayectoria"></canvas>
        </div>

        <div id="result-card" class="result-card hidden">
          <div class="result-title" id="result-title">Carrera terminada</div>
          <div class="result-dist"><b id="result-dist">0</b> m</div>
          <div class="result-grid">
            <div><span>Tiempo</span><b id="result-time">0 s</b></div>
            <div><span>Aviones</span><b id="result-planes">0</b></div>
            <div><span>Trompezos</span><b id="result-stalls">0</b></div>
          </div>
          <button id="btn-again" class="btn-primary">▶ Lanzar de nuevo</button>
        </div>

        <div id="feed" class="feed"></div>
      </section>

      <!-- Panel derecho: aviones, clasificación, récords -->
      <aside id="sidebar" class="panel">
        <h2>Aviones <span id="racers-n" class="badge">0</span></h2>
        <ul id="racers-list" class="players-list"></ul>

        <h2>Clasificación</h2>
        <ol id="standings" class="leaderboard"><li class="empty">Pulsa ▶ para lanzar la carrera</li></ol>

        <h2>Récords</h2>
        <ul id="records" class="history"><li class="empty">Aún no hay récords</li></ul>
      </aside>
    </main>
  </div>

  <script>
  'use strict';

  /* ================================================================
     FÍSICA — modelo determinista (peso, ángulo, longitud de alas)
     ================================================================ */
  const GRAVITY = 9.81;      // m/s²
  const RHO = 1.225;         // kg/m³
  const DT = 1 / 240;        // sub-paso fijo (s)
  const LAUNCH_HEIGHT = 1.6; // m
  const CHORD = 0.10;        // m de cuerda (la envergadura la define el jugador)

  const CD0 = 0.068;         // resistencia parásita del papel
  const K_IND = 0.55;        // resistencia inducida
  const CL_ALPHA = 5.2;      // pendiente Cl (1/rad)
  const AOA_STALL = 0.262;   // 15°
  const CL_MAX = 1.15;
  const CL_POST = 0.35;
  const K_STAB = 46;         // guiñada estabilizadora
  const K_DAMP = 7.5;
  const Q_REF = 45;

  const PARAM_LIMITS = {
    peso: [2, 40],      // gramos
    angulo: [-10, 60],  // grados
    alas: [5, 30],      // cm de envergadura
  };

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const round2 = (v) => Math.round(v * 100) / 100;

  function normalizeParams(raw) {
    const p = {
      peso: Number(raw && raw.peso),
      angulo: Number(raw && raw.angulo),
      alas: Number(raw && raw.alas),
    };
    if (!Number.isFinite(p.peso)) p.peso = 12;
    if (!Number.isFinite(p.angulo)) p.angulo = 18;
    if (!Number.isFinite(p.alas)) p.alas = 15;
    p.peso = clamp(p.peso, ...PARAM_LIMITS.peso);
    p.angulo = clamp(p.angulo, ...PARAM_LIMITS.angulo);
    p.alas = clamp(p.alas, ...PARAM_LIMITS.alas);
    return p;
  }

  function liftCoefficient(aoa) {
    const a = Math.abs(aoa);
    let cl;
    if (a <= AOA_STALL) {
      cl = CL_ALPHA * a;
    } else {
      const over = a - AOA_STALL;
      cl = CL_POST + (CL_MAX - CL_ALPHA * AOA_STALL) * Math.exp(-over / 0.22);
    }
    return Math.sign(aoa) * cl;
  }

  // Ruido determinista a partir de un índice: mismo viento para TODOS los
  // aviones de la carrera (la semilla es única por carrera => carrera justa).
  function hashNoise(i, seed) {
    let h = (Math.imul(i, 374761393) + Math.imul(seed, 668265263)) ^ 0x5bf03635;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296 - 0.5;
  }

  function windParamsForRace(raceSeed) {
    const s = raceSeed >>> 0;
    return {
      base: 0.2 + ((s % 97) / 97) * 1.3,
      phase: ((s % 628) / 100),
      freq: 0.7 + ((s % 53) / 53) * 0.9,
      seed: s,
    };
  }

  function windAt(t, wp) {
    const gust = Math.sin(t * wp.freq + wp.phase) * 0.55;
    const noise = hashNoise(Math.floor(t * 30), wp.seed) * 0.35;
    return Math.max(0, wp.base + gust + noise);
  }

  function createFlight(rawParams, raceSeed) {
    const params = normalizeParams(rawParams);
    const angleRad = (params.angulo * Math.PI) / 180;
    const mass = params.peso / 1000;               // kg
    const area = (params.alas / 100) * CHORD;       // m² de superficie alar
    // Más envergadura => más superficie => más estabilidad de guiñada
    const stab = 0.35 + 1.15 * ((params.alas - PARAM_LIMITS.alas[0]) / (PARAM_LIMITS.alas[1] - PARAM_LIMITS.alas[0]));
    // Lanzamiento humano: algo más rápido con más gramos, sin azar (carrera justa)
    const v0 = 11.8 + (params.peso - 14) * 0.018;
    const wp = windParamsForRace(raceSeed);

    return {
      params,
      mass,
      area,
      stab,
      windParams: wp,
      x: 0,
      y: LAUNCH_HEIGHT,
      vx: Math.cos(angleRad) * v0,
      vy: Math.sin(angleRad) * v0,
      pitch: angleRad,
      omega: 0,
      t: 0,
      flying: true,
      landed: false,
      wind: 0,
      maxAltitude: LAUNCH_HEIGHT,
      maxSpeed: v0,
      maxAoA: 0,
      stalls: 0,
      wasStalled: false,
      trail: [{ x: 0, y: LAUNCH_HEIGHT }],
      trailClock: 0,
    };
  }

  function step(s) {
    if (!s.flying) return s;
    const dt = DT;
    s.wind = windAt(s.t, s.windParams);

    // velocidad relativa al aire
    const wr = s.vx - s.wind;
    const vr = Math.hypot(wr, s.vy);
    const q = 0.5 * RHO * vr * vr;

    const gamma = vr > 0.25 ? Math.atan2(s.vy, wr) : s.pitch;
    let aoa = s.pitch - gamma;
    while (aoa > Math.PI) aoa -= Math.PI * 2;
    while (aoa < -Math.PI) aoa += Math.PI * 2;

    const stalled = Math.abs(aoa) > AOA_STALL;
    if (stalled && !s.wasStalled) s.stalls++;
    s.wasStalled = stalled;
    if (Math.abs(aoa) > s.maxAoA) s.maxAoA = Math.abs(aoa);

    const cl = liftCoefficient(aoa);
    const cd = CD0 + K_IND * cl * cl;
    const lift = q * s.area * cl;
    const drag = q * s.area * cd;

    const invM = 1 / s.mass;
    let ax = 0;
    let ay = -GRAVITY;
    if (vr > 0.01) {
      const ux = wr / vr;
      const uy = s.vy / vr;
      ax += (-drag * ux - lift * uy) * invM;
      ay += (-drag * uy + lift * ux) * invM;
    }

    // guiñada: más envergadura => más autoridad estabilizadora
    const authority = q / Q_REF;
    const pitchAcc = authority * (-K_STAB * s.stab * aoa - K_DAMP * s.omega);
    s.omega += pitchAcc * dt;
    s.pitch += s.omega * dt;
    if (s.pitch > Math.PI * 0.75) s.pitch = Math.PI * 0.75;
    if (s.pitch < -Math.PI * 0.6) s.pitch = -Math.PI * 0.6;

    s.vx += ax * dt;
    s.vy += ay * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.t += dt;

    const speed = Math.hypot(s.vx, s.vy);
    if (s.y > s.maxAltitude) s.maxAltitude = s.y;
    if (speed > s.maxSpeed) s.maxSpeed = speed;

    s.trailClock += dt;
    if (s.trailClock >= 0.045) {
      s.trailClock = 0;
      if (s.trail.length > 700) s.trail.shift();
      s.trail.push({ x: s.x, y: s.y });
    }

    if (s.y <= 0 && s.vy < 0) {
      s.y = 0;
      s.flying = false;
      s.landed = true;
      s.vx = 0;
      s.vy = 0;
      s.omega = 0;
      if (s.trail.length) s.trail.push({ x: s.x, y: 0 });
    }
    if (s.t > 90) {
      s.flying = false;
      s.landed = true;
    }
    return s;
  }

  function flightSummary(s) {
    return {
      distance: round2(s.x),
      flightTime: round2(s.t),
      maxAltitude: round2(s.maxAltitude),
      maxSpeed: round2(s.maxSpeed),
      stalls: s.stalls,
      landed: s.landed,
    };
  }

  /* ================================================================
     RENDERER — cielo, parallax, aviones, estelas, partículas
     ================================================================ */
  const PLANE_LEN = 0.62;

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
    const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
    const b = clamp(Math.round((n & 255) * f), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  function aoaOf(s) {
    const wr = s.vx - s.wind;
    const vr = Math.hypot(wr, s.vy);
    if (vr < 0.25) return 0;
    return s.pitch - Math.atan2(s.vy, wr);
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  class Camera {
    constructor() {
      this.sx0 = 0;
      this.scale = 45;
      this.targetSx0 = 0;
      this.targetScale = 45;
      this.groundY = 0;
    }

    update(dt, w, h, flights) {
      this.groundY = h * 0.86;

      let maxX = 3, maxY = 1.8, minX = 0, n = 0;
      for (const f of flights) {
        const s = f.state;
        if (!s.flying && !f.showMarker) continue;
        maxX = Math.max(maxX, s.x);
        minX = Math.min(minX, s.x);
        maxY = Math.max(maxY, s.y);
        n++;
      }
      if (n === 0) {
        this.targetScale = clamp(w / 26, 18, 70);
        this.targetSx0 = w * 0.18;
      } else {
        const spanX = Math.max(maxX - minX, 6) + 7;
        const scaleW = (w * 0.8) / spanX;
        const scaleAlt = maxY > 1.5 ? (h * 0.72) / maxY : scaleW;
        this.targetScale = clamp(Math.min(scaleW, scaleAlt), 14, 95);
        this.targetSx0 = w * 0.38 - maxX * this.targetScale;
        if (maxX < 8) this.targetSx0 = Math.max(this.targetSx0, w * 0.12 - 2 * this.targetScale);
      }

      const k = 1 - Math.pow(0.0015, dt);
      this.scale = lerp(this.scale, this.targetScale, k);
      this.sx0 = lerp(this.sx0, this.targetSx0, k);
    }

    sx(x) { return this.sx0 + x * this.scale; }
    sy(y) { return this.groundY - y * this.scale; }
  }

  class Renderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.camera = new Camera();
      this.w = 0;
      this.h = 0;
      this.dpr = 1;

      this.clouds = [];
      for (let i = 0; i < 16; i++) {
        this.clouds.push({
          x: i * 26 + Math.random() * 18,
          y: 5.5 + Math.random() * 8,
          s: 0.7 + Math.random() * 1.6,
          layer: Math.random() < 0.5 ? 0.3 : 0.5,
        });
      }

      this.wind = [];
      for (let i = 0; i < 46; i++) this.wind.push(this.newWind(Math.random() * 40, Math.random() * 9));

      this.fx = [];
      this.time = 0;

      this.resize();
      addEventListener('resize', () => this.resize());
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => this.resize()).observe(canvas);
      }
    }

    newWind(x, y) {
      return { x, y, len: 0.6 + Math.random() * 2.2, speed: 1.4 + Math.random() * 2.4, a: 0.05 + Math.random() * 0.16 };
    }

    resize() {
      const rect = this.canvas.getBoundingClientRect();
      this.dpr = Math.min(devicePixelRatio || 1, 2);
      this.w = Math.max(rect.width, 1);
      this.h = Math.max(rect.height, 1);
      this.canvas.width = Math.round(this.w * this.dpr);
      this.canvas.height = Math.round(this.h * this.dpr);
    }

    burstConfetti(x, y, color) {
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 7;
        this.fx.push({
          kind: 'confetti', x, y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 3,
          life: 1.6 + Math.random() * 1.2, age: 0,
          size: 0.09 + Math.random() * 0.1,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 12,
          color: Math.random() < 0.5 ? color : ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ffffff'][i % 5],
        });
      }
    }

    burstScraps(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI - Math.PI;
        const sp = 1.5 + Math.random() * 4;
        this.fx.push({
          kind: 'scrap', x, y,
          vx: Math.cos(a) * sp, vy: Math.abs(Math.sin(a)) * sp + 1.5,
          life: 1.1 + Math.random() * 0.9, age: 0,
          size: 0.1 + Math.random() * 0.14,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 16,
          color,
        });
      }
    }

    update(dt, flights) {
      this.time += dt;
      const cam = this.camera;
      cam.update(dt, this.w, this.h, flights);

      const left = -cam.sx0 / cam.scale;
      const right = (this.w - cam.sx0) / cam.scale;
      for (const p of this.wind) {
        p.x += p.speed * dt;
        if (p.x > right + 2) {
          p.x = left - 1 - Math.random() * 5;
          p.y = 0.5 + Math.random() * 9;
          p.len = 0.6 + Math.random() * 2.2;
          p.speed = 1.4 + Math.random() * 2.4;
        }
      }

      for (let i = this.fx.length - 1; i >= 0; i--) {
        const p = this.fx[i];
        p.age += dt;
        p.vy -= 9.81 * 0.35 * dt;
        p.vx *= 0.995;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; p.vx *= 0.7; }
        if (p.age > p.life) this.fx.splice(i, 1);
      }
    }

    draw(flights) {
      const { ctx, w, h } = this;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      this.drawSky();
      this.drawSun();
      this.drawClouds();
      this.drawHills(0.32, h * 0.72, 26, '#8fb7e8', 0.012);
      this.drawHills(0.55, h * 0.78, 34, '#5f8fcd', 0.02);
      this.drawGround();
      this.drawWind();
      this.drawTrails(flights);
      this.drawMarkers(flights);
      for (const f of flights) this.drawPlane(f);
      this.drawFx();
      this.drawVignette();
    }

    drawSky() {
      const { ctx, w, h } = this;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#2f5fb8');
      g.addColorStop(0.55, '#4a7fd4');
      g.addColorStop(1, '#cfe6ff');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    drawSun() {
      const { ctx, w, h } = this;
      const x = w * 0.78;
      const y = h * 0.16;
      const g = ctx.createRadialGradient(x, y, 4, x, y, 130);
      g.addColorStop(0, 'rgba(255,244,200,0.95)');
      g.addColorStop(0.18, 'rgba(255,224,130,0.55)');
      g.addColorStop(1, 'rgba(255,224,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 130, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff7d6';
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    drawClouds() {
      const { ctx, w, h } = this;
      const cam = this.camera;
      const cx = (cam.sx0 + (w * 0.5 - cam.sx0)) / cam.scale;
      for (const c of this.clouds) {
        const dx = (c.x - cx) * c.layer * cam.scale + w * 0.5;
        if (dx < -220 || dx > w + 220) continue;
        const py = clamp((c.y / 16) * h * 0.45 + h * 0.03, 20, h * 0.55);
        const s = c.s * (c.layer === 0.3 ? 0.75 : 1);
        ctx.fillStyle = `rgba(255,255,255,${c.layer === 0.3 ? 0.5 : 0.82})`;
        ctx.beginPath();
        ctx.ellipse(dx, py, 46 * s, 16 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(dx - 30 * s, py + 6 * s, 28 * s, 12 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(dx + 32 * s, py + 7 * s, 30 * s, 12 * s, 0, 0, Math.PI * 2);
        ctx.ellipse(dx + 8 * s, py - 12 * s, 26 * s, 15 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawHills(parallax, baseY, amp, color, freq) {
      const { ctx, w } = this;
      const cam = this.camera;
      const cxWorld = (w * 0.5 - cam.sx0) / cam.scale;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-4, this.h + 4);
      for (let sx = -4; sx <= w + 4; sx += 8) {
        const wx = (cxWorld + (sx - w * 0.5) / (cam.scale * parallax)) * freq * 60;
        const y = baseY + Math.sin(wx) * amp * 0.55 + Math.sin(wx * 2.3 + 1.7) * amp * 0.35 + Math.sin(wx * 0.43) * amp * 0.5;
        ctx.lineTo(sx, y);
      }
      ctx.lineTo(w + 4, this.h + 4);
      ctx.closePath();
      ctx.fill();
    }

    drawGround() {
      const { ctx, w, h } = this;
      const cam = this.camera;
      const gy = cam.groundY;

      const g = ctx.createLinearGradient(0, gy, 0, h);
      g.addColorStop(0, '#79c267');
      g.addColorStop(0.12, '#4f9d52');
      g.addColorStop(1, '#2f6b3c');
      ctx.fillStyle = g;
      ctx.fillRect(0, gy, w, h - gy);

      const rx0 = cam.sx(-2.2);
      const rx1 = cam.sx(2.2);
      if (rx1 > -50 && rx0 < w + 50) {
        ctx.fillStyle = 'rgba(35,45,70,0.75)';
        ctx.fillRect(rx0, gy, rx1 - rx0, h - gy);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        const segW = (rx1 - rx0) / 8;
        for (let i = 0; i < 8; i += 2) {
          ctx.fillRect(rx0 + i * segW, gy + (h - gy) * 0.45, segW * 0.9, 3);
        }
        ctx.fillRect(rx0, gy, rx1 - rx0, 3);
        ctx.fillStyle = 'rgba(10,20,40,0.9)';
        ctx.font = '800 11px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('SALIDA', (rx0 + rx1) / 2, gy + 20);
      }

      const camRight = (w - cam.sx0) / cam.scale;
      const camLeft = (0 - cam.sx0) / cam.scale;
      const first = Math.max(0, Math.floor(camLeft / 5) * 5);
      ctx.font = '600 10.5px system-ui';
      ctx.textAlign = 'center';
      for (let m = first; m <= camRight + 5; m += 5) {
        if (m === 0) continue;
        const sx = cam.sx(m);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.setLineDash([3, 7]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx, gy - 4);
        ctx.lineTo(sx, gy - Math.min(h * 0.4, 150));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(`${m} m`, sx, gy + 16);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(sx - 0.5, gy - 4, 1, 5);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(cam.sx(0) - 0.5, gy - 4, 1, 5);
    }

    drawWind() {
      const { ctx } = this;
      const cam = this.camera;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      for (const p of this.wind) {
        const x = cam.sx(p.x);
        if (x < -40 || x > this.w + 40) continue;
        const y = cam.sy(p.y);
        if (y < -10 || y > cam.groundY) continue;
        ctx.strokeStyle = `rgba(255,255,255,${p.a})`;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + p.len * cam.scale * 0.5, y);
        ctx.stroke();
      }
    }

    drawTrails(flights) {
      const { ctx } = this;
      const cam = this.camera;
      for (const f of flights) {
        const trail = f.state.trail;
        if (trail.length < 2) continue;
        ctx.save();
        ctx.setLineDash([2.5, 7]);
        ctx.lineWidth = f.highlight ? 2.4 : 1.8;
        ctx.strokeStyle = hexA(f.player.color, f.state.flying ? 0.65 : 0.28);
        ctx.beginPath();
        for (let i = 0; i < trail.length; i++) {
          const px = cam.sx(trail[i].x);
          const py = cam.sy(trail[i].y);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    drawMarkers(flights) {
      const { ctx } = this;
      const cam = this.camera;
      for (const f of flights) {
        if (f.state.flying || !f.showMarker) continue;
        const x = cam.sx(f.state.x);
        if (x < -80 || x > this.w + 80) continue;
        const gy = cam.groundY;
        const age = f.landedAt ? (performance.now() - f.landedAt) / 1000 : 0;
        const alpha = age > 30 ? Math.max(0, 1 - (age - 30) / 5) : 1;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = '#17304f';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(x, gy);
        ctx.lineTo(x, gy - 34);
        ctx.stroke();
        ctx.fillStyle = f.player.color;
        ctx.beginPath();
        ctx.moveTo(x + 1, gy - 34);
        ctx.lineTo(x + 26, gy - 27);
        ctx.lineTo(x + 1, gy - 20);
        ctx.closePath();
        ctx.fill();

        const label = `${f.summary ? f.summary.distance : f.state.x.toFixed(1)} m`;
        ctx.font = '800 13px system-ui';
        const tw = ctx.measureText(label).width + 14;
        const lx = clamp(x - tw / 2, 4, this.w - tw - 4);
        roundRect(ctx, lx, gy - 62, tw, 22, 8);
        ctx.fillStyle = 'rgba(8,12,28,0.88)';
        ctx.fill();
        ctx.fillStyle = f.player.color;
        ctx.textAlign = 'center';
        ctx.fillText(label, lx + tw / 2, gy - 46);
        ctx.restore();
      }
    }

    drawPlane(f) {
      const { ctx } = this;
      const cam = this.camera;
      const s = f.state;
      const x = cam.sx(s.x);
      const y = cam.sy(s.y);
      if (x < -90 || x > this.w + 90 || y < -90 || y > this.h + 90) return;

      const color = f.player.color;
      const speed = Math.hypot(s.vx, s.vy);

      // sombra en el suelo
      const alt = s.y;
      const shAlpha = clamp(0.3 - alt * 0.03, 0.05, 0.3);
      ctx.save();
      ctx.fillStyle = `rgba(10,25,15,${shAlpha})`;
      ctx.beginPath();
      ctx.ellipse(x, cam.groundY + 3, (PLANE_LEN * cam.scale * 0.35) / (1 + alt * 0.16), 3.5 / (1 + alt * 0.1), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // líneas de velocidad
      if (s.flying && speed > 4) {
        ctx.strokeStyle = hexA(color, 0.35);
        ctx.lineWidth = 1.6;
        const back = speed * 0.045 * cam.scale;
        const ux = Math.cos(s.pitch + Math.PI);
        const uy = -Math.sin(s.pitch + Math.PI);
        for (let i = -1; i <= 1; i++) {
          const off = i * 5;
          ctx.beginPath();
          ctx.moveTo(x + ux * back * 0.4 - uy * off, y + uy * back * 0.4 + ux * off);
          ctx.lineTo(x + ux * back - uy * off, y + uy * back + ux * off);
          ctx.stroke();
        }
      }

      // el avión (la envergadura dibuja alas más o menos anchas)
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-s.pitch);
      const L = PLANE_LEN * cam.scale;
      const wingNorm = (f.params.alas - PARAM_LIMITS.alas[0]) / (PARAM_LIMITS.alas[1] - PARAM_LIMITS.alas[0]);
      const B = L * (0.30 + 0.30 * wingNorm);

      ctx.fillStyle = shade(color, 1.25);
      ctx.beginPath();
      ctx.moveTo(L * 0.52, 0);
      ctx.lineTo(-L * 0.5, -B * 0.55);
      ctx.lineTo(-L * 0.16, -B * 0.06);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = shade(color, 0.62);
      ctx.beginPath();
      ctx.moveTo(L * 0.52, 0);
      ctx.lineTo(-L * 0.5, B * 0.55);
      ctx.lineTo(-L * 0.16, B * 0.06);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = shade(color, 0.95);
      ctx.beginPath();
      ctx.moveTo(L * 0.52, 0);
      ctx.lineTo(-L * 0.34, -B * 0.1);
      ctx.lineTo(-L * 0.5, 0);
      ctx.lineTo(-L * 0.34, B * 0.1);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = Math.max(1, L * 0.02);
      ctx.beginPath();
      ctx.moveTo(L * 0.5, 0);
      ctx.lineTo(-L * 0.5, -B * 0.55);
      ctx.moveTo(L * 0.5, 0);
      ctx.lineTo(-L * 0.5, B * 0.55);
      ctx.stroke();
      ctx.restore();

      // etiqueta del piloto + indicador de trompazo
      const showTag = s.flying || f.showMarker;
      if (showTag) {
        const stall = s.flying && Math.abs(aoaOf(s)) > AOA_STALL;
        const tagText = stall ? `⚠ ${f.player.name}` : f.player.name;
        ctx.font = `${f.highlight ? '800' : '600'} 12px system-ui`;
        const tw = ctx.measureText(tagText).width + 16;
        const ty = y - L * 0.62 - 12;
        const tx = clamp(x - tw / 2, 3, this.w - tw - 3);
        roundRect(ctx, tx, ty, tw, 20, 10);
        ctx.fillStyle = stall ? 'rgba(180,30,40,0.92)' : 'rgba(8,12,28,0.85)';
        ctx.fill();
        ctx.strokeStyle = hexA(color, 0.8);
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(tagText, tx + tw / 2, ty + 14);
      }
    }

    drawFx() {
      const { ctx } = this;
      const cam = this.camera;
      for (const p of this.fx) {
        const x = cam.sx(p.x);
        const y = cam.sy(p.y);
        const a = clamp(1 - p.age / p.life, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(x, y);
        ctx.rotate(p.rot);
        const sz = p.size * cam.scale;
        if (p.kind === 'confetti') {
          ctx.fillStyle = p.color;
          ctx.fillRect(-sz / 2, -sz / 4, sz, sz / 2);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.moveTo(-sz / 2, sz / 3);
          ctx.lineTo(sz / 2, sz / 4);
          ctx.lineTo(sz / 3, -sz / 3);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    drawVignette() {
      const { ctx, w, h } = this;
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.max(w, h) * 0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(4,8,20,0.34)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  }

  /* ================================================================
     TELEMETRÍA — gauges en vivo + gráfico del líder
     ================================================================ */
  class Telemetry {
    constructor() {
      this.root = document.getElementById('telemetry');
      this.chart = document.getElementById('chart');
      this.ctx = this.chart.getContext('2d');
      this.visible = false;
    }

    show(v) {
      this.visible = v;
      this.root.classList.toggle('hidden', !v);
    }

    update(state) {
      if (!this.visible || !state) return;
      const speed = Math.hypot(state.vx, state.vy);
      const aoa = (aoaOf(state) * 180) / Math.PI;
      document.getElementById('g-alt').textContent = Math.max(0, state.y).toFixed(1);
      document.getElementById('g-speed').textContent = speed.toFixed(1);
      document.getElementById('g-dist').textContent = state.x.toFixed(1);
      document.getElementById('g-aoa').textContent = aoa.toFixed(1);
      this.drawChart(state);
    }

    drawChart(state) {
      const { ctx } = this;
      const w = this.chart.width;
      const h = this.chart.height;
      ctx.clearRect(0, 0, w, h);

      const trail = state.trail;
      if (trail.length < 2) return;

      let maxX = 1, maxY = 1;
      for (const p of trail) {
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      maxX *= 1.08;
      maxY *= 1.15;

      const pad = 6;
      const px = (x) => pad + (x / maxX) * (w - pad * 2);
      const py = (y) => h - pad - (y / maxY) * (h - pad * 2);

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const gy = pad + ((h - pad * 2) * i) / 4;
        ctx.beginPath();
        ctx.moveTo(pad, gy);
        ctx.lineTo(w - pad, gy);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(px(trail[0].x), h - pad);
      for (const p of trail) ctx.lineTo(px(p.x), py(p.y));
      ctx.lineTo(px(trail[trail.length - 1].x), h - pad);
      ctx.closePath();
      const color = state.ownerColor || '#48dbfb';
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, hexA(color, 0.35));
      g.addColorStop(1, hexA(color, 0.02));
      ctx.fillStyle = g;
      ctx.fill();

      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const x = px(trail[i].x);
        const y = py(trail[i].y);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();

      const head = trail[trail.length - 1];
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px(head.x), py(head.y), 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '9px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(`x ${maxX.toFixed(0)} m · y ${maxY.toFixed(1)} m`, 7, h - 3);
    }
  }

  /* ================================================================
     UI — hangar de aviones, listas, feed, resultados
     ================================================================ */
  const $ = (id) => document.getElementById(id);

  const SWATCHES = [
    '#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#a29bfe',
    '#ff9ff3', '#54a0ff', '#f368e0', '#00d2d3', '#ee5a24',
  ];
  const LS_PLANES = 'paperplane:planes';
  const LS_RECORDS = 'paperplane:records';
  const MAX_PLANES = 16;

  const SEED_PLANES = [
    { nombre: 'Clásico', color: '#48dbfb', peso: 12, angulo: 18, alas: 15 },
    { nombre: 'Bombardero', color: '#ff6b6b', peso: 26, angulo: 10, alas: 10 },
    { nombre: 'Planeador', color: '#1dd1a1', peso: 7, angulo: 26, alas: 25 },
  ];

  function newId() {
    return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function loadStore() {
    let planes = null;
    let records = {};
    try {
      const p = localStorage.getItem(LS_PLANES);
      const r = localStorage.getItem(LS_RECORDS);
      if (p) planes = JSON.parse(p);
      if (r) records = JSON.parse(r);
    } catch { /* sin storage */ }
    if (!Array.isArray(planes) || !planes.length) {
      planes = SEED_PLANES.map((s) => ({ id: newId(), ...s }));
    }
    planes = planes.filter((p) => p && typeof p.nombre === 'string').slice(0, MAX_PLANES);
    if (records && typeof records !== 'object') records = {};
    return { planes, records };
  }

  function saveStore() {
    try {
      localStorage.setItem(LS_PLANES, JSON.stringify(store.planes));
      localStorage.setItem(LS_RECORDS, JSON.stringify(store.records));
    } catch { /* ignorar */ }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  const store = loadStore();
  let editingId = null;   // id del avión en edición (null = sin formulario)
  let formColor = SWATCHES[0];

  // ---------- lista de aviones del hangar ----------
  function renderPlanes() {
    const list = $('planes-list');
    list.innerHTML = '';
    if (!store.planes.length) {
      list.innerHTML = '<div class="empty-note">El hangar está vacío.<br>Crea tu primer avión para empezar.</div>';
    }
    for (const p of store.planes) {
      const rec = store.records[p.id];
      const div = document.createElement('div');
      div.className = 'plane-card' + (editingId === p.id ? ' editing' : '');
      div.innerHTML =
        `<span class="swatch" style="background:${p.color};color:${p.color}"></span>` +
        `<span class="pc-info"><span class="pc-name">${escapeHtml(p.nombre)}</span>` +
        `<span class="pc-meta">${p.peso} g · ${p.angulo}° · ${p.alas} cm</span></span>` +
        (rec ? `<span class="pc-record">🏆 ${rec.best} m</span>` : '') +
        `<span class="pc-actions">` +
        `<button class="icon-btn" data-act="edit" title="Editar">✎</button>` +
        `<button class="icon-btn" data-act="del" title="Borrar">✕</button>` +
        `</span>`;
      div.querySelector('[data-act="edit"]').onclick = () => openForm(p.id);
      div.querySelector('[data-act="del"]').onclick = () => deletePlane(p.id);
      list.appendChild(div);
    }
    $('planes-n').textContent = store.planes.length;
    $('planes-chip').textContent = `${store.planes.length} ${store.planes.length === 1 ? 'avión' : 'aviones'}`;
    $('btn-new').disabled = store.planes.length >= MAX_PLANES || raceActive();
    updatePlayButton();
  }

  function deletePlane(id) {
    if (raceActive()) return;
    const p = store.planes.find((x) => x.id === id);
    if (!p) return;
    if (!confirm(`¿Borrar el avión "${p.nombre}"?`)) return;
    store.planes = store.planes.filter((x) => x.id !== id);
    delete store.records[id];
    if (editingId === id) closeForm();
    saveStore();
    renderPlanes();
    renderRecords();
    renderRacers();
  }

  // ---------- formulario ----------
  function buildColorPicker() {
    const box = $('f-colors');
    box.innerHTML = '';
    for (const c of SWATCHES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.style.background = c;
      b.style.color = c;
      b.dataset.color = c;
      b.onclick = () => selectColor(c);
      box.appendChild(b);
    }
  }

  function selectColor(c) {
    formColor = c;
    $('f-colors').querySelectorAll('button').forEach((b) => b.classList.toggle('sel', b.dataset.color === c));
    drawPreview(c);
  }

  function openForm(id) {
    if (raceActive()) return;
    editingId = id || null;
    const p = id ? store.planes.find((x) => x.id === id) : null;
    $('form-title').textContent = p ? `Editar: ${p.nombre}` : 'Nuevo avión';
    $('f-name').value = p ? p.nombre : '';
    $('f-peso').value = p ? p.peso : 12;
    $('f-angulo').value = p ? p.angulo : 18;
    $('f-alas').value = p ? p.alas : 15;
    syncFormLabels();
    selectColor(p ? p.color : nextColor());
    $('plane-form').classList.remove('hidden');
    $('btn-new').hidden = true;
    $('f-name').focus();
    renderPlanes();
  }

  function closeForm() {
    editingId = null;
    $('plane-form').classList.add('hidden');
    $('btn-new').hidden = false;
    renderPlanes();
  }

  function nextColor() {
    const used = new Set(store.planes.map((p) => p.color));
    return SWATCHES.find((c) => !used.has(c)) || SWATCHES[Math.floor(Math.random() * SWATCHES.length)];
  }

  function syncFormLabels() {
    $('v-peso').textContent = `${$('f-peso').value} g`;
    $('v-angulo').textContent = `${$('f-angulo').value}°`;
    $('v-alas').textContent = `${$('f-alas').value} cm`;
  }

  function saveForm(e) {
    e.preventDefault();
    if (raceActive()) return;
    const nombre = $('f-name').value.trim() || `Avión ${store.planes.length + 1}`;
    const data = {
      nombre: nombre.slice(0, 16),
      color: formColor,
      peso: Number($('f-peso').value),
      angulo: Number($('f-angulo').value),
      alas: Number($('f-alas').value),
    };
    if (editingId) {
      const p = store.planes.find((x) => x.id === editingId);
      if (p) Object.assign(p, data);
    } else {
      if (store.planes.length >= MAX_PLANES) { closeForm(); return; }
      store.planes.push({ id: newId(), ...data });
    }
    saveStore();
    closeForm();
    renderRecords();
    renderRacers();
  }

  // ---------- preview (ilustración fija, solo cambia el color) ----------
  function drawPreview(color) {
    const canvas = $('preview');
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const gy = h - 14;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(0, gy, w, 2);

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    for (const [sx, sy, len] of [[14, 22, 34], [36, 70, 22], [150, 16, 26], [200, 82, 30]]) {
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + len, sy);
      ctx.stroke();
    }

    const L = 70;
    const B = L * 0.4;
    const c = color || '#e8eeff';
    ctx.save();
    ctx.translate(w * 0.5, gy - 42);
    ctx.rotate(-0.28);
    ctx.fillStyle = shade(c, 1.25);
    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.lineTo(-L * 0.5, -B * 0.55);
    ctx.lineTo(-L * 0.15, -B * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = shade(c, 0.62);
    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.lineTo(-L * 0.5, B * 0.55);
    ctx.lineTo(-L * 0.15, B * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.lineTo(-L * 0.5, -B * 0.55);
    ctx.moveTo(L * 0.5, 0);
    ctx.lineTo(-L * 0.5, B * 0.55);
    ctx.stroke();
    ctx.restore();

    ctx.font = '700 11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('tu avión de papel', w - 8, 18);
  }

  // ---------- listas del sidebar ----------
  // Sincronización por clave: solo se toca el DOM de lo que cambió,
  // así el panel derecho no se reconstruye (ni parpadea) cada refresco.
  function syncList(ul, items) {
    const existing = new Map();
    for (const li of ul.children) existing.set(li.dataset.key, li);
    const used = new Set();
    let ref = ul.firstElementChild;
    for (const it of items) {
      let li = existing.get(it.key);
      const cls = ((it.cls || '') + (li && li.classList.contains('enter') ? ' enter' : '')).trim();
      if (li) {
        if (li.dataset.html !== it.html) {
          li.innerHTML = it.html;
          li.dataset.html = it.html;
        }
        if (li.className !== cls) li.className = cls;
      } else {
        li = document.createElement('li');
        li.dataset.key = it.key;
        li.dataset.html = it.html;
        li.innerHTML = it.html;
        li.className = ((it.cls || '') + ' enter').trim();
        li.addEventListener('animationend', () => li.classList.remove('enter'), { once: true });
      }
      used.add(li);
      if (ref === li) ref = ref.nextElementSibling;
      else ul.insertBefore(li, ref);
    }
    for (const li of Array.from(ul.children)) if (!used.has(li)) li.remove();
  }

  function renderRacers() {
    const ul = $('racers-list');
    const items = raceActive() || (race && race.flights.length)
      ? race.flights.map((f) => f.plane)
      : store.planes;
    const rows = [];
    for (const p of items) {
      let stateHtml = '';
      if (race && race.flights.length) {
        const f = race.flights.find((x) => x.plane.id === p.id);
        if (f) {
          if (f.state.flying) stateHtml = `<span class="state flying">✈ ${f.state.x.toFixed(1)} m</span>`;
          else stateHtml = `<span class="state done">🏁 ${f.summary ? f.summary.distance : f.state.x.toFixed(1)} m</span>`;
        }
      }
      if (!stateHtml) {
        const rec = store.records[p.id];
        stateHtml = `<span class="state">${rec ? '🏆 ' + rec.best + ' m' : 'listo'}</span>`;
      }
      rows.push({
        key: p.id,
        html: `<span class="swatch" style="background:${p.color};color:${p.color}"></span>` +
          `<span>${escapeHtml(p.nombre)}</span>${stateHtml}`,
      });
    }
    syncList(ul, rows);
    const n = String(items.length);
    if ($('racers-n').textContent !== n) $('racers-n').textContent = n;
  }

  function renderStandings() {
    const ol = $('standings');
    if (!race || !race.flights.length) {
      syncList(ol, [{ key: '__empty', cls: 'empty', html: 'Pulsa ▶ para lanzar la carrera' }]);
      return;
    }
    const flying = race.flights.filter((f) => f.state.flying).sort((a, b) => b.state.x - a.state.x);
    const landed = race.flights.filter((f) => !f.state.flying).sort((a, b) => (b.summary ? b.summary.distance : 0) - (a.summary ? a.summary.distance : 0));
    const order = [...landed, ...flying];
    const rows = order.map((f) => {
      const d = f.state.flying
        ? `${f.state.x.toFixed(1)} m ✈`
        : `${f.summary ? f.summary.distance : 0} m 🏁`;
      return {
        key: f.id,
        html: `<span class="swatch" style="background:${f.player.color};width:9px;height:9px;border-radius:3px"></span>` +
          `<span>${escapeHtml(f.player.name)}</span><span class="lb-dist">${d}</span>`,
      };
    });
    syncList(ol, rows);
  }

  function renderRecords() {
    const ul = $('records');
    const rows = store.planes
      .filter((p) => store.records[p.id])
      .map((p) => ({ p, rec: store.records[p.id] }))
      .sort((a, b) => b.rec.best - a.rec.best);
    if (!rows.length) {
      ul.innerHTML = '<li class="empty">Aún no hay récords</li>';
      return;
    }
    ul.innerHTML = '';
    for (const { p, rec } of rows) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="swatch" style="background:${p.color}"></span>` +
        `<span><b>${escapeHtml(p.nombre)}</b></span><span class="rec-dist">${rec.best} m</span>`;
      ul.appendChild(li);
    }
  }

  // ---------- feed ----------
  function feed(text) {
    const box = $('feed');
    const div = document.createElement('div');
    div.className = 'feed-msg';
    div.textContent = text;
    box.appendChild(div);
    while (box.children.length > 6) box.removeChild(box.firstChild);
    setTimeout(() => div.classList.add('fade'), 4600);
    setTimeout(() => div.remove(), 5600);
  }

  // ---------- resultado ----------
  function showResult({ winner, summary, time, planes, stalls, record }) {
    $('result-title').textContent = winner ? `🏆 ¡Gana ${winner.nombre}!` : 'Carrera terminada';
    $('result-dist').textContent = summary.distance.toFixed(1);
    $('result-time').textContent = `${time} s`;
    $('result-planes').textContent = planes;
    $('result-stalls').textContent = stalls;
    $('result-card').classList.toggle('record', !!record);
    $('result-card').classList.remove('hidden');
  }

  function hideResult() {
    $('result-card').classList.add('hidden');
  }

  /* ================================================================
     CARRERA + BUCLE PRINCIPAL
     ================================================================ */
  const renderer = new Renderer(document.getElementById('scene'));
  const telemetry = new Telemetry();

  let race = null;     // { flights: [], seed, startTime, done }
  let uid = 0;

  function raceActive() {
    return !!(race && !race.done);
  }

  function updatePlayButton() {
    const b = $('btn-play');
    if (raceActive()) {
      b.disabled = true;
      b.textContent = '▶ En carrera…';
    } else if (!store.planes.length) {
      b.disabled = true;
      b.textContent = '▶ Lanzar carrera';
    } else {
      b.disabled = false;
      b.textContent = race ? '▶ Otra carrera' : '▶ Lanzar carrera';
    }
    $('btn-new').disabled = store.planes.length >= MAX_PLANES || raceActive();
  }

  function setRaceState(on) {
    $('conn-dot').className = 'dot' + (on ? ' race' : '');
    $('state-label').textContent = on ? 'en carrera' : 'listo';
    for (const id of ['f-peso', 'f-angulo', 'f-alas']) $(id).disabled = on;
    $('f-name').disabled = on;
  }

  function startRace() {
    if (raceActive() || !store.planes.length) return;
    hideResult();

    const seed = (Date.now() ^ Math.floor(Math.random() * 1e6)) >>> 0;
    race = { flights: [], seed, startTime: performance.now(), done: false };

    for (const plane of store.planes) {
      const state = createFlight({ peso: plane.peso, angulo: plane.angulo, alas: plane.alas }, seed);
      state.ownerColor = plane.color;
      race.flights.push({
        id: 'f' + (++uid),
        plane,
        player: { name: plane.nombre, color: plane.color },
        params: { peso: plane.peso, angulo: plane.angulo, alas: plane.alas },
        state,
        highlight: false,
        showMarker: false,
        landedAt: 0,
        summary: null,
        localLanded: false,
        recordShown: false,
      });
    }

    setRaceState(true);
    updatePlayButton();
    if (editingId) closeForm();
    telemetry.show(true);
    renderStandings();
    renderRacers();
    feed(`▶ ¡${race.flights.length} aviones a la pista!`);
    setStatus('Líder en pantalla…');
  }

  function finishLocalLanding(f) {
    if (f.localLanded) return;
    f.localLanded = true;
    f.showMarker = true;
    f.landedAt = performance.now();
    f.summary = flightSummary(f.state);

    renderer.burstScraps(f.state.x, 0.05, f.player.color);

    // récord por avión
    const prev = store.records[f.plane.id];
    if (!prev || f.summary.distance > prev.best) {
      const isImprovement = !!prev;
      store.records[f.plane.id] = { best: f.summary.distance };
      saveStore();
      renderRecords();
      renderPlanes();
      if (isImprovement && f.summary.distance > 0) {
        feed(`🏆 ¡Nuevo récord de ${f.player.name}: ${f.summary.distance} m!`);
      }
    }

    renderStandings();
    renderRacers();

    if (race && race.flights.every((x) => x.localLanded)) finishRace();
  }

  function finishRace() {
    if (!race || race.done) return;
    race.done = true;
    setRaceState(false);
    telemetry.show(false);
    updatePlayButton();
    renderStandings();

    const order = [...race.flights].sort(
      (a, b) => (b.summary ? b.summary.distance : 0) - (a.summary ? a.summary.distance : 0),
    );
    const winner = order[0];
    const time = Math.round((performance.now() - race.startTime) / 100) / 10;
    const isRecord = winner && winner.summary && winner.summary.distance > 0 &&
      store.records[winner.plane.id] && store.records[winner.plane.id].best === winner.summary.distance;

    if (winner) {
      renderer.burstConfetti(winner.state.x, Math.max(winner.state.y, 1.4), winner.player.color);
      feed(`🏁 Fin de carrera: gana ${winner.player.name} con ${winner.summary.distance} m`);
      setStatus(`Ganador: ${winner.player.name} · ${winner.summary.distance} m`);
      showResult({
        winner: winner.plane,
        summary: winner.summary,
        time,
        planes: race.flights.length,
        stalls: winner.summary.stalls,
        record: isRecord,
      });
    }
  }

  function setStatus(text) {
    $('race-status').textContent = text || '';
  }

  // ---------- eventos de UI ----------
  $('btn-new').onclick = () => openForm(null);
  $('plane-form').onsubmit = saveForm;
  $('f-cancel').onclick = closeForm;
  $('btn-play').onclick = startRace;
  $('btn-again').onclick = startRace;
  for (const id of ['f-peso', 'f-angulo', 'f-alas']) {
    $(id).addEventListener('input', syncFormLabels);
  }

  // ---------- bucle principal ----------
  let last = performance.now();
  let acc = 0;
  let lastUi = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    acc += dt;
    let guard = 0;
    while (acc >= DT && guard < 720) {
      if (race) {
        for (const f of race.flights) {
          if (f.state.flying) {
            step(f.state);
            if (!f.state.flying) finishLocalLanding(f);
          }
        }
      }
      acc -= DT;
      guard++;
    }
    if (acc > DT * 4) acc = 0;

    // líder actual (el que va más lejos en el aire)
    let leader = null;
    if (race) {
      for (const f of race.flights) {
        if (f.state.flying && (!leader || f.state.x > leader.state.x)) leader = f;
        f.highlight = false;
      }
      if (leader) leader.highlight = true;
    }

    const list = race ? race.flights : [];
    renderer.update(dt, list);
    renderer.draw(list);

    if (raceActive() && leader) {
      telemetry.show(true);
      telemetry.update(leader.state);
    } else if (!raceActive() && race && race.done) {
      telemetry.show(false);
    }

    // refresco de listas (máx. ~7 veces/seg)
    if (now - lastUi > 140) {
      lastUi = now;
      if (race) {
        renderRacers();
        if (raceActive()) renderStandings();
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------- arranque ----------
  buildColorPicker();
  renderPlanes();
  renderRacers();
  renderStandings();
  renderRecords();
  drawPreview(SWATCHES[0]);
  updatePlayButton();
  setStatus(store.planes.length ? 'Crea, edita y lanza cuando quieras' : '');
  requestAnimationFrame(frame);
  </script>
</body>
</html>
